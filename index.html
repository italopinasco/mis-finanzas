<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f4e78"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"><title>Mis Finanzas</title></head><body>
<div id="login"><div class="login"><h1>💵 Mis Finanzas</h1><p>PEN + USD · sincronizado</p><form id="lf"><input id="le" type="email" placeholder="Correo" required><input id="lp" type="password" placeholder="Contraseña" required><button>Ingresar</button><div id="lm"></div></form></div></div>
<div id="app" hidden><header><b>Mis Finanzas</b><button id="logout">Salir</button></header><main>
<section id="dash"><input id="month" type="month"><div class="cards"><article><small>INGRESOS</small><b id="ip"></b><span id="iu"></span></article><article><small>GASTOS</small><b id="gp"></b><span id="gu"></span></article><article><small>SALDO DEL MES</small><b id="bp"></b><span id="bu"></span></article><article><small>AHORRO</small><b id="pct"></b><span id="saveu"></span></article></div><div class="panel"><h3>Saldo acumulado</h3><div class="grid"><div>Inicial PEN<b id="op"></b></div><div>Final PEN<b id="cp"></b></div><div>Inicial USD<b id="ou"></b></div><div>Final USD<b id="cu"></b></div></div></div><div class="panel"><h3>Tipo de cambio</h3><div class="grid"><div>Compra<b id="buy"></b></div><div>Venta<b id="sell"></b></div></div></div><div class="actions"><button onclick="show('income')">＋ Ingreso</button><button class="red" onclick="show('expense')">－ Gasto</button></div><div class="panel"><h3>Gastos por categoría</h3><div id="cats"></div></div></section>
<section id="income" hidden><h2>Registrar ingreso</h2><form id="if"><input id="id" type="date" required><select id="ic"><option>Sueldo</option><option>Negocio</option><option>Freelance</option><option>Otros ingresos</option></select><select id="iuu"><option>PEN</option><option>USD</option></select><input id="ia" type="number" step=".01" placeholder="Monto" required><input id="iacc" placeholder="Cuenta"><input id="ides" placeholder="Descripción"><label><input id="tax" type="checkbox"> Aplicar 8% a sueldo</label><div id="pv"></div><button>Guardar ingreso</button></form></section>
<section id="expense" hidden><h2>Registrar gasto</h2><form id="ef"><input id="ed" type="date" required><select id="ec"><option>Vivienda</option><option>Alimentación</option><option>Transporte</option><option>Salud</option><option>Educación</option><option>Entretenimiento</option><option>Compras</option><option>Finanzas</option><option>Ahorro</option><option>Otros</option></select><select id="eu"><option>PEN</option><option>USD</option></select><input id="ea" type="number" step=".01" placeholder="Monto" required><select id="em"><option>Débito</option><option>Crédito</option><option>Transferencia</option><option>Efectivo</option><option>Yape/Plin</option><option>Otro</option></select><input id="eacc" placeholder="Cuenta"><input id="edes" placeholder="Descripción"><button class="red">Guardar gasto</button></form></section>
<section id="moves" hidden><h2>Movimientos</h2><input id="rm" type="month"><select id="rt"><option value="">Todos</option><option>Ingreso</option><option>Gasto</option></select><div id="ml"></div></section>
<section id="settings" hidden><h2>Configuración</h2><form id="sf"><label>Compra<input id="sb" type="number" step=".0001"></label><label>Venta<input id="ss" type="number" step=".0001"></label><label>Objetivo anual USD<input id="goal" type="number" step=".01"></label><button>Guardar</button></form></section>
</main><nav><button onclick="show('dash')">⌂<small>Inicio</small></button><button onclick="show('income')">＋<small>Ingreso</small></button><button onclick="show('expense')">−<small>Gasto</small></button><button onclick="show('moves')">☷<small>Movimientos</small></button><button onclick="show('settings')">⚙<small>Config.</small></button></nav></div><script src="app.js"></script></body></html>
